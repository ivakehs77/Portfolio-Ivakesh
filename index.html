<script>
/* ── Matrix rain ─────────────────────────────────────────────── */
(function() {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let cols, drops;
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01';

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    cols  = Math.floor(canvas.width / 16);
    drops = Array(cols).fill(1);
  }

  function draw() {
    ctx.fillStyle = 'rgba(10,10,15,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff9f';
    ctx.font = '14px monospace';
    drops.forEach((y, i) => {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 16, y * 16);
      if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }

  resize();
  window.addEventListener('resize', resize);
  setInterval(draw, 50);
})();

  snake() {
    if (snakeActive) return;
    blank();
    addLine('  <span style="color:var(--dim)">arrow keys to move · q to quit · good luck</span>');
    blank();

    const W = 28, H = 14;
    let snake = [{x:8,y:6},{x:7,y:6},{x:6,y:6}];
    let dir = {x:1,y:0}, nextDir = {x:1,y:0};
    let score = 0;
    let food = mkFood();
    let interval;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'white-space:pre;line-height:1.5;';
    wrap.className = 'line output-line';
    output.appendChild(wrap);
    scrollBottom();

    function mkFood() {
      let p;
      do { p = {x:Math.floor(Math.random()*W), y:Math.floor(Math.random()*H)}; }
      while (snake.some(s=>s.x===p.x&&s.y===p.y));
      return p;
    }

    const HEAD = {right:'▶',left:'◀',up:'▲',down:'▼'};

    function render() {
      const g = Array.from({length:H}, ()=>Array(W).fill(0));
      snake.forEach((s,i)=>{ if(s.x>=0&&s.x<W&&s.y>=0&&s.y<H) g[s.y][s.x]=i===0?2:1; });
      g[food.y][food.x]=3;
      const hd = nextDir.x===1?'right':nextDir.x===-1?'left':nextDir.y===-1?'up':'down';
      const top    = `  ┌${'─'.repeat(W)}┐`;
      const bottom = `  └${'─'.repeat(W)}┘`;
      const rows = g.map(row=>'  │'+row.map(c=>{
        if(c===0) return ' ';
        if(c===1) return `<span style="color:var(--green)">█</span>`;
        if(c===2) return `<span style="color:var(--green);font-weight:bold">${HEAD[hd]}</span>`;
        return `<span style="color:#f0c040">◆</span>`;
      }).join('')+'│');
      const bar = `  score: <span style="color:var(--green);font-weight:700">${score}</span>   <span style="color:var(--dim)">↑↓←→ move · q quit</span>`;
      wrap.innerHTML = bar+'\n'+top+'\n'+rows.join('\n')+'\n'+bottom;
      scrollBottom();
    }

    function step() {
      dir = nextDir;
      const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
      if(head.x<0||head.x>=W||head.y<0||head.y>=H||snake.some(s=>s.x===head.x&&s.y===head.y)){
        end('game over'); return;
      }
      snake.unshift(head);
      if(head.x===food.x&&head.y===food.y){ score++; food=mkFood(); } else snake.pop();
      render();
    }

    function end(reason) {
      clearInterval(interval);
      snakeActive = false;
      snakeKeyHandler = null;
      render();
      blank();
      addLine(`  <span style="color:#ff4444">${reason}</span> · score: <span style="color:var(--green);font-weight:700">${score}</span>`);
      const msg = score>=15?"ok you're clearly a problem solver. hire me.":score>=8?'not bad. type snake to play again.':'skill issue. type snake to try again.';
      addLine(`  <span style="color:var(--dim)">${msg}</span>`);
      blank();
    }

    snakeKeyHandler = e => {
      const {x,y} = dir;
      if      (e.key==='ArrowUp'    && y!== 1) nextDir={x:0, y:-1};
      else if (e.key==='ArrowDown'  && y!==-1) nextDir={x:0, y:1};
      else if (e.key==='ArrowLeft'  && x!== 1) nextDir={x:-1,y:0};
      else if (e.key==='ArrowRight' && x!==-1) nextDir={x:1, y:0};
      else if (e.key==='q' || e.key==='Q')     end('you quit');
      e.preventDefault();
    };

    snakeActive = true;
    render();
    interval = setInterval(step, 130);
  },

const autoplay = [
  { cmd: 'import abishek', delay: 600 },

let skipAutoplay = false;
let autoplayDone = false;

function sleep(ms) {
  return skipAutoplay ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
}

function randDelay(base, variance) {
  return base + (Math.random() - 0.5) * variance;
}

async function typeCommand(text) {
  const promptDiv = document.createElement('div');
  promptDiv.className = 'line prompt-line';
  const prefix = document.createElement('span');
  prefix.className = 'prompt-prefix';
  prefix.textContent = 'abishek@portfolio:~$ ';
  const typed = document.createElement('span');
  const cursor = document.createElement('span');
  cursor.id = 'autoplay-cursor';
  promptDiv.appendChild(prefix);
  promptDiv.appendChild(typed);
  promptDiv.appendChild(cursor);
  output.appendChild(promptDiv);
  scrollBottom();

  if (skipAutoplay) {
    typed.textContent = text;
  } else {
    for (let i = 0; i < text.length; i++) {
      if (skipAutoplay) { typed.textContent = text; break; }
      typed.textContent += text[i];
      scrollBottom();
      await sleep(randDelay(55, 40));
    }
  }

  await sleep(200);
  cursor.remove();
  return promptDiv;
}

function onEscSkip(e) {
  if (e.key === 'Escape' && !autoplayDone) skipAutoplay = true;
}
document.addEventListener('keydown', onEscSkip);

async function runAutoplay() {
  await sleep(500);

  for (const step of autoplay) {
    await typeCommand(step.cmd);
    const key = step.display || step.cmd;
    if (responses[key]) {
      await sleep(120);
      responses[key]();
    }
    await sleep(step.delay);
  }

  await sleep(400);
  blank();
  addLine('  Type <span style="color:var(--green)">help</span> to explore further<span id="autoplay-cursor"></span>', 'output-line');
  blank();
  await sleep(200);

  autoplayDone = true;
  inputRow.style.display = 'flex';
  input.focus();

  // Deep link: ?cmd=whoami
  const urlCmd = new URLSearchParams(window.location.search).get('cmd');
  if (urlCmd) {
    const k = urlCmd.toLowerCase();
    const promptDiv = document.createElement('div');
    promptDiv.className = 'line prompt-line';
    promptDiv.innerHTML = `<span class="prompt-prefix">abishek@portfolio:~$&nbsp;</span>${escHtml(urlCmd)}`;
    output.appendChild(promptDiv);
    scrollBottom();
    if (responses[k]) responses[k]();
  }
}

  default: { bg:'#fdf6e3', green:'#268bd2', dim:'#657b83', darkGreen:'#eee8d5', surface:'#e8e2d4', statusText:'#fdf6e3', statusBg:'#268bd2' },
  amber:   { bg:'#0f0800', green:'#ffb347', dim:'#8a6030', darkGreen:'#3d1a00', surface:'#1a0e00', statusText:'#0f0800', statusBg:'#ffb347' },
  matrix:  { bg:'#000800', green:'#00ff00', dim:'#008800', darkGreen:'#003300', surface:'#001800', statusText:'#000800', statusBg:'#00ff00' },
  classic: { bg:'#0a0a0f', green:'#00ff9f', dim:'#5a8a6a', darkGreen:'#003d26', surface:'#1a1a24', statusText:'#0a0a0f', statusBg:'#00ff9f' },
};

function applyTheme(name, silent = false) {
  const t = THEMES[name];
  if (!t) {
    blank();
    addLine(`  unknown theme. available: <span style="color:var(--green)">default · amber · matrix · classic</span>`);
    blank();
    return;
  }
  const r = document.documentElement.style;
  r.setProperty('--bg',         t.bg);
  r.setProperty('--green',      t.green);
  r.setProperty('--dim',        t.dim);
  r.setProperty('--dark-green', t.darkGreen);
  r.setProperty('--surface',    t.surface);
  document.getElementById('statusbar').style.background = t.statusBg;
  document.getElementById('statusbar').style.color      = t.statusText;
  document.getElementById('matrix').style.display = (name === 'default') ? 'none' : 'block';
  if (!silent) {
    blank();
    addLine(`  theme set to <span style="color:var(--green)">${name}</span>`);
    blank();
  }
}

/* ── Tab autocomplete ────────────────────────────────────────── */
const COMMANDS = [
  'help','help --all','import abishek','projects','skills','experience','tree','contact','status',
  'now','uses','history','clear','revert','hello','hi',
  'cat puripy','cat astralecture','cat ragchatbot',
  'open github','open linkedin','open resume',
  'sudo hire-me','sudo',
  'man','man whoami','man projects','man skills','man experience','man contact',

  'theme','theme default','theme amber','theme matrix','theme classic',
  'snake',
];

/* ── Interactive input ───────────────────────────────────────── */
input.addEventListener('keydown', e => {
  // Snake game intercept
  if (snakeActive && snakeKeyHandler) { snakeKeyHandler(e); return; }

  // Bash-style shortcuts
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); responses.clear(); return; }
  if (e.ctrlKey && e.key === 'u') { e.preventDefault(); input.value = ''; return; }
  if (e.ctrlKey && e.key === 'c') {
    e.preventDefault();
    const val = input.value;
    input.value = '';
    if (val) addLine(`<span class="prompt-prefix">abishek@portfolio:~$&nbsp;</span>${escHtml(val)}<span style="color:var(--dim)">^C</span>`, 'prompt-line');
    return;
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value.toLowerCase().trimStart();
    if (!val) return;
    const matches = COMMANDS.filter(c => c.startsWith(val));
    if (matches.length === 1) {
      input.value = matches[0];
    } else if (matches.length > 1) {
      blank();
      addLine('  ' + matches.join('    '));
      blank();
    }
    return;
  }

  if (e.key === 'Enter') {
    const raw = input.value.trim();
    if (!raw) return;
    input.value = '';

    // Echo command
    const promptDiv = document.createElement('div');
    promptDiv.className = 'line prompt-line';
    promptDiv.innerHTML = `<span class="prompt-prefix">abishek@portfolio:~$&nbsp;</span>${escHtml(raw)}`;
    output.appendChild(promptDiv);
    scrollBottom();

    // History
    history.unshift(raw);
    if (history.length > 100) history.pop();
    histIdx = -1;

    // Run
    const key = raw.toLowerCase();
    if (responses[key]) {
      responses[key]();
    } else if (key.startsWith('man ')) {
      blank();
      addLine(`  <span style="color:var(--dim)">no manual entry for "${escHtml(raw.slice(4))}".</span>`);
      addLine(`  try: <span style="color:var(--green)">man help</span> for a list of documented commands.`);
      blank();
    } else if (key.startsWith('theme ')) {
      applyTheme(key.slice(6).trim());
    } else {
      blank();
      addLine(`  <span class="error">command not found: ${escHtml(raw)}</span>  type <span style="color:var(--green)">help</span> for available commands`);
      blank();
    }
  }

  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) {
      histIdx++;
      input.value = history[histIdx];
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    }
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) {
      histIdx--;
      input.value = history[histIdx];
    } else {
      histIdx = -1;
      input.value = '';
    }
  }
});

// Keep input focused when clicking anywhere in the terminal
document.getElementById('output').addEventListener('click', e => {
  if (!window.getSelection().toString()) input.focus();
});

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Window buttons ──────────────────────────────────────────── */
const termWin    = document.getElementById('terminal-window');
const closeModal = document.getElementById('close-modal');

// Red — show close modal
document.querySelector('.dot.red').addEventListener('click', () => {
  closeModal.classList.add('show');
});

document.getElementById('modal-cancel').addEventListener('click', () => {
  closeModal.classList.remove('show');
});

document.getElementById('modal-confirm').addEventListener('click', () => {
  closeModal.classList.remove('show');
  window.close();
  // window.close() silently fails for user-opened tabs — surface the shortcut
  setTimeout(() => {
    blank();
    addLine('  <span style="color:var(--dim)">Browser blocked the close. Use your keyboard shortcut:</span>');
    addLine('  <span style="color:var(--green)">Cmd+W</span> on Mac &nbsp;·&nbsp; <span style="color:var(--green)">Ctrl+W</span> on Windows');
    blank();
  }, 150);
});

closeModal.addEventListener('click', e => {
  if (e.target === closeModal) closeModal.classList.remove('show');
});

// Yellow — toggle minimize
let isMinimized = false;
const macDesktop = document.getElementById('macos-desktop');

function setMinimized(val) {
  isMinimized = val;
  termWin.classList.toggle('minimized', isMinimized);
  macDesktop.classList.toggle('visible', isMinimized);
  if (!isMinimized) setTimeout(() => input.focus(), 380);
}

// Mac dock terminal icon — restore terminal
document.getElementById('dock-terminal').addEventListener('click', e => {
  e.preventDefault();
  setMinimized(false);
});

// Mac menubar clock
(function() {
  const el = document.getElementById('mac-clock-disp');
  function tick() {
    const now = new Date();
    el.textContent = now.toLocaleTimeString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  }
  tick();
  setInterval(tick, 1000);
})();

document.querySelector('.dot.yellow').addEventListener('click', () => {
  setMinimized(!isMinimized);
});

document.getElementById('titlebar').addEventListener('click', e => {
  if (isMinimized && !e.target.closest('.dot')) setMinimized(false);
});

// Green — toggle fullscreen
document.querySelector('.dot.green').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});
</script>
