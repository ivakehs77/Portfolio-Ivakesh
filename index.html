(function() {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let cols, drops;
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01';

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    cols  = Math.floor(canvas.width / 16);
    drops = Array(cols).fill(1);
  }

  function draw() {
    ctx.fillStyle = 'rgba(10,10,15,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff9f';
    ctx.font = '14px monospace';
    drops.forEach((y, i) => {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 16, y * 16);
      if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }

  resize();
  window.addEventListener('resize', resize);
  setInterval(draw, 50);
})();

/* ── Auto-play sequence ──────────────────────────────────────── */
const autoplay = [
  { cmd: 'whoami', delay: 600 },
  { cmd: 'ls projects/', delay: 900 },
  { cmd: 'cat projects/puripy', display: 'cat puripy', delay: 800 },
  { cmd: 'status', delay: 700 },
];

let skipAutoplay = false;
let autoplayDone = false;

function sleep(ms) {
  return skipAutoplay ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
}

function randDelay(base, variance) {
  return base + (Math.random() - 0.5) * variance;
}

async function typeCommand(text) {
  const promptDiv = document.createElement('div');
  promptDiv.className = 'line prompt-line';
  const prefix = document.createElement('span');
  prefix.className = 'prompt-prefix';
  prefix.textContent = 'abishek@portfolio:~$ ';
  const typed = document.createElement('span');
  const cursor = document.createElement('span');
  cursor.id = 'autoplay-cursor';
  promptDiv.appendChild(prefix);
  promptDiv.appendChild(typed);
  promptDiv.appendChild(cursor);
  output.appendChild(promptDiv);
  scrollBottom();

  if (skipAutoplay) {
    typed.textContent = text;
  } else {
    for (let i = 0; i < text.length; i++) {
      if (skipAutoplay) { typed.textContent = text; break; }
      typed.textContent += text[i];
      scrollBottom();
      await sleep(randDelay(55, 40));
    }
  }

  await sleep(200);
  cursor.remove();
  return promptDiv;
}

function onEscSkip(e) {
  if (e.key === 'Escape' && !autoplayDone) skipAutoplay = true;
}
document.addEventListener('keydown', onEscSkip);

async function runAutoplay() {
  await sleep(500);

  for (const step of autoplay) {
    await typeCommand(step.cmd);
    const key = step.display || step.cmd;
    if (responses[key]) {
      await sleep(120);
      responses[key]();
    }
    await sleep(step.delay);
  }

  await sleep(400);
  blank();
  addLine('  Type <span style="color:var(--green)">help</span> to explore further<span id="autoplay-cursor"></span>', 'output-line');
  blank();
  await sleep(200);

  autoplayDone = true;
  inputRow.style.display = 'flex';
  input.focus();

  // Restore saved theme
  const savedTheme = localStorage.getItem('portfolio-theme');
  if (savedTheme && savedTheme !== 'default') applyTheme(savedTheme, true);

  // Deep link: ?cmd=whoami
  const urlCmd = new URLSearchParams(window.location.search).get('cmd');
  if (urlCmd) {
    const k = urlCmd.toLowerCase();
    const promptDiv = document.createElement('div');
    promptDiv.className = 'line prompt-line';
    promptDiv.innerHTML = `<span class="prompt-prefix">abishek@portfolio:~$&nbsp;</span>${escHtml(urlCmd)}`;
    output.appendChild(promptDiv);
    scrollBottom();
    if (responses[k]) responses[k]();
  }
}

runAutoplay();

  r.setProperty('--green',      t.green);
  r.setProperty('--dim',        t.dim);
  r.setProperty('--dark-green', t.darkGreen);
  r.setProperty('--surface',    t.surface);

  document.getElementById('statusbar').style.color      = t.statusText;
  document.getElementById('matrix').style.display = (name === 'solar') ? 'none' : '';

  if (!silent) {
    blank();
    addLine(`  theme set to <span style="color:var(--green)">${name}</span>`);

  }

/* ── Interactive input ───────────────────────────────────────── */
input.addEventListener('keydown', e => {
  // Bash-style shortcuts
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); responses.clear(); return; }
  if (e.ctrlKey && e.key === 'u') { e.preventDefault(); input.value = ''; return; }
  if (e.ctrlKey && e.key === 'c') {
    e.preventDefault();
    const val = input.value;
    input.value = '';
    if (val) addLine(`<span class="prompt-prefix">abishek@portfolio:~$&nbsp;</span>${escHtml(val)}<span style="color:var(--dim)">^C</span>`, 'prompt-line');
    return;
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value.toLowerCase().trimStart();
    if (!val) return;
    const matches = COMMANDS.filter(c => c.startsWith(val));
    if (matches.length === 1) {
      input.value = matches[0];
    } else if (matches.length > 1) {
      blank();
      addLine('  ' + matches.join('    '));
      blank();
    }
    return;
  }

  if (e.key === 'Enter') {
    const raw = input.value.trim();
    if (!raw) return;
    input.value = '';

    // Echo command
    const promptDiv = document.createElement('div');
    promptDiv.className = 'line prompt-line';
    promptDiv.innerHTML = `<span class="prompt-prefix">abishek@portfolio:~$&nbsp;</span>${escHtml(raw)}`;
    output.appendChild(promptDiv);
    scrollBottom();

    // History
    history.unshift(raw);
    if (history.length > 100) history.pop();
    histIdx = -1;

    // Riddle interceptor
    if (awaitingRiddle) {
      const ans = raw.toLowerCase().trim();
      if (ans === '1' || ans === 'one') {
        awaitingRiddle   = false;
        hackdevUnlocked  = true;
        blank();
        addLine('  <span style="color:var(--green)">✓ correct.</span>', 'output-line');
        blank();
        addLine('  secret command unlocked.');
        blank();
        const big = document.createElement('div');
        big.className = 'line output-line';
        big.innerHTML = '  <span style="font-size:23px;font-weight:700;color:var(--green)">try "hackdev" to hack this website</span>';
        output.appendChild(big);
        scrollBottom();
        blank();
      } else {
        blank();
        addLine('  <span class="error">wrong.</span> <span style="color:var(--dim)">hint: 0^0 is a classic CS debate — but the answer here is a single digit.</span>');
        blank();
      }
      return;
    }

    // Run
    const key = raw.toLowerCase();
    if (responses[key]) {
      responses[key]();
    } else if (key.startsWith('man ')) {
      blank();
      addLine(`  <span style="color:var(--dim)">no manual entry for "${escHtml(raw.slice(4))}".</span>`);
      addLine(`  try: <span style="color:var(--green)">man help</span> for a list of documented commands.`);
      blank();
    } else if (key.startsWith('theme ')) {
      applyTheme(key.slice(6).trim());
    } else {
      blank();
      addLine(`  <span class="error">command not found: ${escHtml(raw)}</span>  type <span style="color:var(--green)">help</span> for available commands`);
      blank();
    }
  }

  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) {
      histIdx++;
      input.value = history[histIdx];
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    }
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) {
      histIdx--;
      input.value = history[histIdx];
    } else {
      histIdx = -1;
      input.value = '';
    }
  }
});

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
